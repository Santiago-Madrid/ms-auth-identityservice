<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperación de Contraseña</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333333;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eeeeee;
        }
        .header h1 {
            color: #2c3e50;
            font-size: 32px;
            margin: 0;
            letter-spacing: 2px;
        }
        .content {
            padding: 20px 0;
            text-align: center;
        }
        .content p {
            font-size: 16px;
            line-height: 1.5;
        }
        .code {
            display: inline-block;
            font-size: 28px;
            font-weight: bold;
            color: #e74c3c;
            background-color: #f9f9f9;
            padding: 10px 20px;
            border: 2px dashed #e74c3c;
            border-radius: 5px;
            margin: 20px 0;
            letter-spacing: 5px;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #999999;
            border-top: 1px solid #eeeeee;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WORLD DANCE</h1>
        </div>
        <div class="content">
            <p>Hola,</p>
            <p>Has solicitado recuperar tu contraseña. Por favor utiliza el siguiente código numérico para completar el proceso:</p>
            <div class="code" th:text="${code}">123456</div>
            <p>Este código expirará pronto. Si no has solicitado esto, puedes ignorar este correo.</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 World Dance. Todos los derechos reservados.</p>
        </div>
    </div>
</body>
</html>
